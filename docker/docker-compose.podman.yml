# Override de Docker Compose para Podman sobre WSL2.
#
# POR QUÉ EXISTE — dos limitaciones del entorno local, ninguna del proyecto:
#
# 1. El kernel de WSL2 (5.15) no soporta la expresión nftables `fib daddr` en
#    cadenas de familia `inet`, que netavark 2.0 necesita para publicar puertos
#    y montar su driver de firewall. Con red bridge, todo contenedor falla con
#    "netavark (exit code 1): nftables error: ... Could not process rule".
#    Workaround: `network_mode: host` para todos los servicios, que evita por
#    completo netavark. A cambio no hay DNS de compose: los servicios se
#    hablan por 127.0.0.1.
#
# 2. Sin publicación de puertos, el acceso desde Windows se hace por túnel SSH:
#       ssh -L 8011:127.0.0.1:8011 -N -p 50566 -i <key> user@127.0.0.1
#
# PUERTOS — esta máquina Podman ya corre otro stack (autorespwhats) en red host
# que ocupa 3000, 3002, 5432, 6379, 6380 y 8000. Por eso este stack usa
# 5434 / 6381 / 8011 en lugar de los puertos por defecto. No se toca el otro stack.
#
# El 8011 sustituye al 8010 porque el 8010 quedó retenido por un socket TCP
# huérfano de una sesión anterior: bind() falla con EADDRINUSE desde la propia
# VM y con SO_REUSEPORT, pero ni ss, ni /proc/net/tcp{,6}, ni lsof muestran
# ningún socket en ese puerto. Se comprobó que 8011/8012/8099 están libres.
#
# Uso:
#   DOCKER_HOST=npipe:////./pipe/podman-machine-default \
#     docker compose -f docker/docker-compose.yml -f docker/docker-compose.podman.yml up -d
#
# Este override es específico del entorno local de Windows+WSL2. En Docker o
# Podman sobre Linux se usa únicamente docker/docker-compose.yml.

x-db-url: &db-url postgresql+asyncpg://otelms:otelms_dev_password@127.0.0.1:5434/otelms
x-redis-url: &redis-url redis://127.0.0.1:6381/0
x-broker-url: &broker-url redis://127.0.0.1:6381/1
x-backend-url: &backend-url redis://127.0.0.1:6381/2

# Las URLs se escriben enteras en cada servicio en vez de usar los anclas de
# arriba a propósito: en la forma de lista (`- KEY=valor`) un ancla YAML no se
# resuelve dentro del escalar, así que `- CELERY_URL=*redis-url` llegaría al
# contenedor como el texto literal "*redis-url" y Celery moriría al arrancar con
# ModuleNotFoundError. Para deduplicar hay que usar la forma de mapa
# (`KEY: *redis-url`), que el compose base no usa.

services:
  postgres:
    network_mode: host
    ports: []
    networks: !reset []
    command: ["postgres", "-p", "5434"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5434 -U otelms -d otelms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    network_mode: host
    ports: []
    networks: !reset []
    command: ["redis-server", "--port", "6381", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    network_mode: host
    ports: []
    networks: !reset []
    command: ["uvicorn", "otelms.api.main:app", "--host", "0.0.0.0", "--port", "8011"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://otelms:otelms_dev_password@127.0.0.1:5434/otelms
      - REDIS_URL=redis://127.0.0.1:6381/0
      - CELERY_BROKER_URL=redis://127.0.0.1:6381/1
      - CELERY_RESULT_BACKEND=redis://127.0.0.1:6381/2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on: !reset []

  worker:
    network_mode: host
    networks: !reset []
    environment:
      - DATABASE_URL=postgresql+asyncpg://otelms:otelms_dev_password@127.0.0.1:5434/otelms
      - REDIS_URL=redis://127.0.0.1:6381/0
      - CELERY_BROKER_URL=redis://127.0.0.1:6381/1
      - CELERY_RESULT_BACKEND=redis://127.0.0.1:6381/2
    depends_on: !reset []

  beat:
    network_mode: host
    networks: !reset []
    environment:
      - DATABASE_URL=postgresql+asyncpg://otelms:otelms_dev_password@127.0.0.1:5434/otelms
      - REDIS_URL=redis://127.0.0.1:6381/0
      - CELERY_BROKER_URL=redis://127.0.0.1:6381/1
      - CELERY_RESULT_BACKEND=redis://127.0.0.1:6381/2
    depends_on: !reset []